[project]
name = "content-optimization-exploration"
version = "0.1.0"
description = "Reproducible preliminary analysis of the citation dataset"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4==4.15.0",
    "duckdb==1.5.6",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "markdown-it-py>=4.2.0",
    "joblib>=1.6.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pyarrow>=25.0.1",
    "scikit-learn>=1.9.1",
    "scipy==1.18.1",
    "trafilatura>=2.2.0",
    "markdownify==1.2.3",
    "umap-learn>=0.5.12",
    "tiktoken>=0.14.0",
    "tokenizers>=0.23.2",
]

[project.optional-dependencies]
local-embeddings = [
    "voyage-4-nano-mlx ; platform_machine == 'arm64' and sys_platform == 'darwin'",
]

[tool.uv]
package = false

[tool.uv.sources]
voyage-4-nano-mlx = { git = "https://github.com/sanjay920/voyage-4-nano-mlx", rev = "5001811de8d5ab39bcdab1c9b40b925d8d7d3983" }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
