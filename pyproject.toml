[project]
name = "content-optimization-exploration"
version = "0.1.0"
description = "Reproducible preliminary analysis of the citation dataset"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4==4.15.0",
    "duckdb==1.5.6",
    "lxml>=6.1.3",
    "markdown-it-py>=4.2.0",
    "scipy==1.18.1",
    "trafilatura>=2.2.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
